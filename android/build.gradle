group 'com.gsshop.mobile.flutter.flutter_hawk'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        jcenter()
        mavenCentral()
		maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'com.gsshop.mobile.flutter.flutter_hawk'
    compileSdkVersion 30

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Hawk 16KB — Conceal은 플러그인(AAR)에 넣으면 안 됨. 앱(android/app)에서만 추가 (README 참고)
    // implementation 'com.github.gsshop-microsvc:hawk:2.1.6-16kb'
    implementation("com.orhanobut:hawk:2.0.1") {
    exclude(group = "com.facebook.conceal", module = "conceal")
}
implementation("com.github.GundamD:conceal:v1.1.3-16kb-fixed-3") // Fixed artifact
}
