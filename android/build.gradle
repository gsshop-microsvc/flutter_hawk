group 'com.gsshop.mobile.flutter.flutter_hawk'
version '1.0-SNAPSHOT'

// AGP 8+: Android Library는 implementation files("*.aar") 금지(bundleDebugAar 실패).
// libs의 16KB AAR을 synthetic Maven 리포로 복사한 뒤 좌표 의존으로만 참조한다.
def concealSynthMavenRoot = new File(project.buildDir, "synthetic-maven-repo")
def concealSynthGroup = "com.gsshop.mobile.flutterhawk"
def concealSynthArtifact = "conceal-16kb"
def concealSynthVersion = "1.1.3"
def concealSynthRelPath = "${concealSynthGroup.replace('.', '/')}/${concealSynthArtifact}/${concealSynthVersion}"
def concealSynthModuleDir = new File(concealSynthMavenRoot, concealSynthRelPath)
def concealSynthSrcAar = file("${projectDir}/libs/conceal-1.1.3-16kb.aar")
def concealSynthDestAar = new File(concealSynthModuleDir, "${concealSynthArtifact}-${concealSynthVersion}.aar")
def concealSynthDestPom = new File(concealSynthModuleDir, "${concealSynthArtifact}-${concealSynthVersion}.pom")

concealSynthModuleDir.mkdirs()
if (!concealSynthSrcAar.exists()) {
    throw new RuntimeException("Missing ${concealSynthSrcAar}. Add android/libs/conceal-1.1.3-16kb.aar to the plugin.")
}
if (!concealSynthDestAar.exists() || concealSynthSrcAar.lastModified() > concealSynthDestAar.lastModified()) {
    ant.copy(file: concealSynthSrcAar, tofile: concealSynthDestAar)
    concealSynthDestPom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${concealSynthGroup}</groupId>
  <artifactId>${concealSynthArtifact}</artifactId>
  <version>${concealSynthVersion}</version>
  <packaging>aar</packaging>
</project>
"""
}

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        // 호스트 :app 이 flutter_hawk 트랜지티브를 풀 때에도 동일 경로에서 conceal 좌표를 찾을 수 있게 전역 등록
        maven { url = concealSynthMavenRoot.toURI() }
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'com.gsshop.mobile.flutter.flutter_hawk'
    compileSdkVersion 30

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Hawk transitive Conceal(4KB .so) 제외 → 플러그인이 아래 좌표로만 Conceal 고정
    implementation('com.orhanobut:hawk:2.0.1') {
        exclude group: 'com.facebook.conceal', module: 'conceal'
    }
    implementation "${concealSynthGroup}:${concealSynthArtifact}:${concealSynthVersion}"
}
